name: Build All and Publish

on:
  workflow_dispatch:
    inputs:
      force-build:
        description: Force the build of all packages
        type: boolean
        default: false
      branch:
        description: The branch to build
        type: choice
        options:
          - beta
          - master
          - oldstable
        default: master

defaults:
  run:
    shell: sh

jobs:
  _setup:
    runs-on: ubuntu-24.04
    outputs:
      packages: ${{ steps.setup.outputs.packages }}
    steps:
      - name: Setup workspace
        uses: callmetango/setup-workspace@HEAD
        with:
          inputs: ${{ toJSON(inputs) }}
          vars: ${{ toJSON(vars) }}

      - name: Setup next release
        id: setup
        env:
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          . setup-build-env.sh
          setup-next-release.sh "$BINPKGS_REPO" "$STAGING_TAG" "$FORCE_BUILD"

  xlibre-input-elographics:
    if: |
      !failure() && !cancelled() &&
      contains(fromJSON(needs._setup.outputs.packages), 'xlibre-input-elographics')
    uses: ./.github/workflows/build-package.yml
    needs:
      - _setup
      - xlibre-xserver
    with:
      package: xlibre-input-elographics
      branch: ${{ inputs.branch }}
    secrets: inherit

  xlibre-input-evdev:
    if: |
      !failure() && !cancelled() &&
      contains(fromJSON(needs._setup.outputs.packages), 'xlibre-input-evdev')
    uses: ./.github/workflows/build-package.yml
    needs:
      - _setup
      - xlibre-xserver
    with:
      package: xlibre-input-evdev
      branch: ${{ inputs.branch }}
    secrets: inherit

  xlibre-input-libinput:
