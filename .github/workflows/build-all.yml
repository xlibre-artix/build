      contains(fromJSON(needs._setup.outputs.packages), 'xlibre-xserver')
    uses: ./.github/workflows/build-package.yml
    needs:
      - _setup
    with:
      package: xlibre-xserver
      branch: ${{ inputs.branch }}
    secrets: inherit

  all-packages:
    if: |
      !cancelled() && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-24.04
    needs:
      - xlibre-input-elographics
      - xlibre-input-evdev
      - xlibre-input-libinput
      - xlibre-input-synaptics
      - xlibre-input-vmmouse
      - xlibre-input-void
      - xlibre-input-wacom
      - xlibre-meta
      - xlibre-video-amdgpu
      - xlibre-video-ati
      - xlibre-video-dummy
      - xlibre-video-fbdev
      - xlibre-video-intel
      - xlibre-video-nouveau
      - xlibre-video-qxl
      - xlibre-video-sisusb
      - xlibre-video-vesa
      - xlibre-video-vmware
      - xlibre-video-voodoo
      - xlibre-xserver
    steps:
      - name: Setup workspace
        uses: callmetango/setup-workspace@HEAD
        with:
          inputs: ${{ toJSON(inputs) }}
          vars: ${{ toJSON(vars) }}

      - name: Release new release
        env:
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          create_pkgdb=1; delete_source=1
          . setup-build-env.sh
          copy-release.sh "$BINPKGS_REPO" "$STAGING_TAG" \
              "$BINPKGS_REPO" "$RELEASED_TAG" $create_pkgdb $delete_source
